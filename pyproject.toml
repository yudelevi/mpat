[project]
name = "mpat"
version = "0.0.1"
description = "Lockfile-based upstream drift tracking for Python monkeypatches"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Yudelevich" }]
requires-python = ">=3.11"
dependencies = ["packaging>=23", "tomli-w>=1.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: Pytest",
]

[project.urls]
Homepage = "https://monkeypat.ch"
Repository = "https://github.com/yudelevi/mpat"

[project.scripts]
mpat = "mpat._cli:main"

[build-system]
requires = ["uv_build>=0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "ruff", "ty"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
